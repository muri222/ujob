[project]
name = "radar-brain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pypdf>=6.21.1",
    "fpdf2>=2.8.9",
    "truststore>=0.10.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
