name: ujob

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: [/tmp]

services:
  panel:
    <<: *hardening
    build: ../apps/panel
    env_file: ../.env
    volumes:
      - ./data/panel:/panel/pb_data
    networks: [internal, outbound]

  scout:
    <<: *hardening
    build: ../services/scout
    env_file: ../.env
    environment:
      PANEL_URL: http://panel:8090
    depends_on: [panel]
    networks: [internal, outbound]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    env_file: ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [panel]
    networks: [internal, outbound]

networks:
  internal:
    internal: true
  outbound: {}

volumes:
  caddy_data:
  caddy_config:
